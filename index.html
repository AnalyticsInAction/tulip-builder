<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Tulip Builder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="tabs-container">
      <div class="tabs-content">
        <div id="build-content" class="tab-content">
          <div id="player-content"></div>
        </div>

        <div id="progress-content" class="tab-content hidden">
          <div id="tracker-content"></div>
        </div>

        <div id="photos-content" class="tab-content hidden">
          <div id="journal-content"></div>
        </div>
      </div>

      <nav class="tab-nav">
        <button data-tab="build" class="active">Build</button>
        <button data-tab="progress">Progress</button>
        <button data-tab="photos">Photos</button>
      </nav>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>

</body>
</html>
